services:
  - type: web
    name: stock-signal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --timeout 120   # workers=1 避免内建推送重复发送（见 README 第9.4节）
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: FLASK_DEBUG
        value: "0"
