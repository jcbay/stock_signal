<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能预警 - 股票信号分析系统 v4</title>
  <style>
    :root {
      --bg-primary: #1a1a2e;
      --bg-secondary: #16213e;
      --bg-card: #0f3460;
      --bg-card-hover: #1a4a8a;
      --text-primary: #e0e0e0;
      --text-secondary: #a0a0b0;
      --text-muted: #606070;
      --border: #2a2a4a;
      --red-up: #e74c3c;
      --green-down: #2ecc71;
      --blue: #3498db;
      --purple: #9b59b6;
      --orange: #e67e22;
      --yellow: #f1c40f;
      --cyan: #00bcd4;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg-primary); color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px;
    }
    header h1 { font-size: 22px; color: var(--cyan); font-weight: 500; }
    header .subtitle { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    .nav-links { display: flex; gap: 8px; }
    .nav-link {
      padding: 8px 16px; border: 1px solid var(--border); border-radius: 6px;
      background: var(--bg-card); color: var(--cyan); text-decoration: none;
      font-size: 13px; cursor: pointer;
    }
    .nav-link:hover { border-color: var(--cyan); }

    .summary-bar {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px; margin-bottom: 20px;
    }
    .summary-card {
      background: var(--bg-secondary); border-radius: 12px; padding: 18px;
      border: 1px solid var(--border); transition: border-color 0.3s;
    }
    .summary-card:hover { border-color: var(--cyan); }
    .sc-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .sc-value { font-size: 24px; font-weight: 600; }

    .section-title { font-size: 16px; color: var(--text-primary); margin: 28px 0 12px; }
    .text-red { color: var(--red-up); }
    .text-green { color: var(--green-down); }
    .text-cyan { color: var(--cyan); }
    .text-yellow { color: var(--yellow); }
    .text-muted { color: var(--text-muted); }
    .text-orange { color: var(--orange); }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .data-table-wrap {
      background: var(--bg-secondary); border-radius: 12px; overflow: hidden;
      border: 1px solid var(--border);
    }
    table th {
      padding: 10px 12px; text-align: left; font-weight: 500;
      color: var(--text-muted); border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    table td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
    table tr:hover td { background: rgba(0,188,212,0.05); }
    .tag { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
    .tag-active { background: rgba(0,188,212,0.15); color: var(--cyan); }
    .tag-triggered { background: rgba(231,76,60,0.2); color: var(--red-up); }

    .btn {
      padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer;
      font-size: 13px; font-weight: 500; transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: var(--cyan); color: #fff; }
    .btn-check { background: var(--orange); color: #fff; }
    .btn-danger { background: transparent; border: 1px solid var(--red-up); color: var(--red-up); }
    .btn-reset { background: transparent; border: 1px solid var(--cyan); color: var(--cyan); }
    .btn-sm { padding: 4px 10px; font-size: 12px; }

    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      z-index: 1000; justify-content: center; align-items: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--bg-secondary); border-radius: 16px; padding: 28px;
      width: 480px; max-width: 90vw; border: 1px solid var(--border);
    }
    .modal h2 { font-size: 18px; margin-bottom: 20px; color: var(--cyan); }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 8px; background: var(--bg-primary); color: var(--text-primary);
      font-size: 14px; outline: none;
    }
    .form-group input:focus, .form-group select:focus { border-color: var(--cyan); }
    .form-row { display: flex; gap: 12px; }
    .form-row .form-group { flex: 1; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

    .empty-state { text-align: center; padding: 40px; color: var(--text-muted); }
    .loading { text-align: center; padding: 40px; color: var(--text-muted); }
    .triggered-banner {
      background: rgba(231,76,60,0.1); border: 1px solid rgba(231,76,60,0.3);
      border-radius: 12px; padding: 16px; margin-bottom: 20px; display: none;
    }
    .triggered-banner.show { display: block; }
    .triggered-banner h3 { color: var(--red-up); font-size: 14px; margin-bottom: 8px; }
    .triggered-item {
      padding: 8px 0; border-bottom: 1px solid rgba(231,76,60,0.15);
      font-size: 13px; display: flex; justify-content: space-between; align-items: center;
    }
    .triggered-item:last-child { border: none; }

    .alert-type-desc { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    /* 响应式适配 */
    @media (max-width: 768px) {
      .container { padding: 10px; }
      .page-header { flex-direction: column; align-items: flex-start; gap: 8px; }
      .nav-links { flex-wrap: wrap; gap: 6px; }

      /* 汇总条2列 */
      .summary-bar { grid-template-columns: 1fr 1fr; gap: 8px; }
      .summary-card { padding: 10px; }
      .sc-value { font-size: 18px; }

      /* 预警列表纵向堆叠 */
      .alert-card {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }
      .alert-info { width: 100%; }

      /* 弹窗全屏 */
      .modal { width: 95vw !important; max-width: 95vw !important; max-height: 90vh; overflow-y: auto; padding: 16px; }
      .form-row { flex-direction: column; gap: 0; }
    }

    @media (max-width: 480px) {
      .sc-value { font-size: 16px; }
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>智能预警中心</h1>
      <div class="subtitle">价格预警 · 信号变化 · 止损止盈 · 当日异动</div>
    </div>
    <div class="nav-links">
      <a href="/" class="nav-link">分析</a>
      <a href="/portfolio" class="nav-link">持仓</a>
      <a href="/journal" class="nav-link">交易日志</a>
      <button class="btn btn-primary" onclick="showAddModal()">+ 新建预警</button>
    </div>
  </header>

  <div class="summary-bar">
    <div class="summary-card"><div class="sc-label">活跃预警</div><div class="sc-value text-cyan" id="sc-active">--</div></div>
    <div class="summary-card"><div class="sc-label">已触发</div><div class="sc-value text-red" id="sc-triggered">--</div></div>
    <div class="summary-card"><div class="sc-label">预警总数</div><div class="sc-value text-muted" id="sc-total">--</div></div>
    <div class="summary-card" style="display:flex;align-items:center;justify-content:center;">
      <button class="btn btn-check" onclick="checkAlerts()" id="check-btn">立即检查预警</button>
    </div>
  </div>

  <div class="triggered-banner" id="triggered-banner">
    <h3>触发预警</h3>
    <div id="triggered-list"></div>
  </div>

  <div class="section-title">预警规则列表</div>
  <div class="data-table-wrap">
    <table>
      <thead>
        <tr>
          <th>状态</th>
          <th>股票</th>
          <th>预警类型</th>
          <th>阈值</th>
          <th>创建时间</th>
          <th>触发时间</th>
          <th>最后检查</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="rules-body">
        <tr><td colspan="8" class="loading">加载中...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <h2>新建预警规则</h2>
    <div class="form-group">
      <label>股票代码</label>
      <input type="text" id="a-code" placeholder="6位代码，如 600519" maxlength="6">
    </div>
    <div class="form-group">
      <label>预警类型</label>
      <select id="a-type" onchange="updateThresholdHint()">
        <option value="price_above">价格上穿 — 股价涨到指定价格时提醒</option>
        <option value="price_below">价格下穿 — 股价跌到指定价格时提醒</option>
        <option value="signal_buy">信号看多 — 评分突破指定分数时提醒</option>
        <option value="signal_sell">信号看空 — 评分跌破指定分数时提醒</option>
        <option value="stop_loss">止损预警 — 持仓亏损达到指定百分比</option>
        <option value="take_profit">止盈预警 — 持仓盈利达到指定百分比</option>
        <option value="daily_drop">当日大跌 — 跌幅超过指定百分比</option>
        <option value="daily_rise">当日大涨 — 涨幅超过指定百分比</option>
      </select>
      <div class="alert-type-desc" id="threshold-hint">输入目标价格，如 10.50</div>
    </div>
    <div class="form-group">
      <label>阈值</label>
      <input type="number" id="a-threshold" placeholder="根据预警类型输入数值" step="0.01">
    </div>
    <div class="form-group">
      <label>备注（选填）</label>
      <input type="text" id="a-message" placeholder="如：突破阻力位就买">
    </div>
    <div class="modal-actions">
      <button class="btn" style="background:var(--bg-card);color:var(--text-secondary);" onclick="hideAddModal()">取消</button>
      <button class="btn btn-primary" onclick="submitAlert()">创建预警</button>
    </div>
  </div>
</div>

<script>
const typeLabels = {
  price_above: '价格上穿', price_below: '价格下穿',
  signal_buy: '信号看多', signal_sell: '信号看空',
  stop_loss: '止损预警', take_profit: '止盈预警',
  daily_drop: '当日大跌', daily_rise: '当日大涨'
};
const thresholdHints = {
  price_above: '输入目标价格，如 10.50',
  price_below: '输入目标价格，如 8.00',
  signal_buy: '输入评分阈值，如 60（评分突破60分时提醒）',
  signal_sell: '输入评分阈值，如 35（评分跌破35分时提醒）',
  stop_loss: '输入亏损百分比，如 8（亏损8%时提醒）',
  take_profit: '输入盈利百分比，如 20（盈利20%时提醒）',
  daily_drop: '输入跌幅百分比，如 5（当日跌5%时提醒）',
  daily_rise: '输入涨幅百分比，如 5（当日涨5%时提醒）'
};

function updateThresholdHint() {
  const type = document.getElementById('a-type').value;
  document.getElementById('threshold-hint').textContent = thresholdHints[type] || '';
}

function fmtTime(s) {
  if (!s) return '--';
  return s.replace('T', ' ').substring(0, 16);
}

async function loadRules() {
  const body = document.getElementById('rules-body');
  body.innerHTML = '<tr><td colspan="8" class="loading">加载中...</td></tr>';
  try {
    const resp = await fetch('/api/alerts');
    const data = await resp.json();
    if (!data || data.length === 0) {
      body.innerHTML = '<tr><td colspan="8" class="empty-state">暂无预警规则，点击"新建预警"创建</td></tr>';
    } else {
      body.innerHTML = data.map(r => `
        <tr>
          <td>${r.status === 'active' ? '<span class="tag tag-active">活跃</span>' : '<span class="tag tag-triggered">已触发</span>'}</td>
          <td>${r.stock_name || r.stock_code}(${r.stock_code})</td>
          <td>${typeLabels[r.alert_type] || r.alert_type}</td>
          <td>${r.threshold || '--'}</td>
          <td style="white-space:nowrap;">${fmtTime(r.created_at)}</td>
          <td style="white-space:nowrap;">${r.triggered_at ? fmtTime(r.triggered_at) : '--'}</td>
          <td style="white-space:nowrap;">${r.last_checked ? fmtTime(r.last_checked) : '--'}</td>
          <td style="white-space:nowrap;">
            ${r.status === 'triggered' ? `<button class="btn btn-reset btn-sm" onclick="resetAlert(${r.id})">重置</button>` : ''}
            <button class="btn btn-danger btn-sm" onclick="deleteAlert(${r.id})">删除</button>
          </td>
        </tr>
      `).join('');
    }

    const active = data.filter(r => r.status === 'active').length;
    const triggered = data.filter(r => r.status === 'triggered').length;
    document.getElementById('sc-active').textContent = active;
    document.getElementById('sc-triggered').textContent = triggered;
    document.getElementById('sc-total').textContent = data.length;
  } catch(e) {
    body.innerHTML = '<tr><td colspan="8" class="empty-state">加载失败</td></tr>';
  }
}

function showAddModal() { document.getElementById('add-modal').classList.add('show'); }
function hideAddModal() { document.getElementById('add-modal').classList.remove('show'); }

async function submitAlert() {
  const code = document.getElementById('a-code').value.trim();
  const type = document.getElementById('a-type').value;
  const threshold = document.getElementById('a-threshold').value;
  const message = document.getElementById('a-message').value.trim();

  if (!code || code.length !== 6) { alert('请输入6位股票代码'); return; }
  if (!threshold) { alert('请输入阈值'); return; }

  try {
    const resp = await fetch('/api/alerts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, alert_type: type, threshold: parseFloat(threshold), message })
    });
    const data = await resp.json();
    if (data.error) { alert(data.error); return; }
    hideAddModal();
    document.getElementById('a-code').value = '';
    document.getElementById('a-threshold').value = '';
    document.getElementById('a-message').value = '';
    loadRules();
  } catch(e) { alert('创建失败: ' + e.message); }
}

async function deleteAlert(id) {
  if (!confirm('确定删除这条预警规则？')) return;
  try {
    await fetch(`/api/alerts?id=${id}`, { method: 'DELETE' });
    loadRules();
  } catch(e) { alert('删除失败'); }
}

async function resetAlert(id) {
  try {
    await fetch(`/api/alerts/${id}/reset`, { method: 'POST' });
    loadRules();
  } catch(e) { alert('重置失败'); }
}

async function checkAlerts() {
  const btn = document.getElementById('check-btn');
  btn.textContent = '检查中...'; btn.disabled = true;
  try {
    const resp = await fetch('/api/alerts/check', { method: 'POST' });
    const data = await resp.json();

    const banner = document.getElementById('triggered-banner');
    const list = document.getElementById('triggered-list');

    if (data.triggered && data.triggered.length > 0) {
      banner.classList.add('show');
      list.innerHTML = data.triggered.map(t => `
        <div class="triggered-item">
          <span>${t.message}</span>
          <span class="text-muted" style="font-size:12px;">${t.triggered_at}</span>
        </div>
      `).join('');
    } else {
      banner.classList.remove('show');
      alert(`检查完成：共检查${data.checked}条规则，暂无触发`);
    }
    loadRules();
  } catch(e) {
    alert('检查失败: ' + e.message);
  }
  btn.textContent = '立即检查预警'; btn.disabled = false;
}

loadRules();
</script>
</body>
</html>
